name: Android

# Builds every push. Releases are published by uploading an APK signed with the release key
# (see README), so no signing secrets live on GitHub.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: |
          V="dev-${GITHUB_SHA::7}"
          cp app/build/outputs/apk/release/app-release.apk "anypad-$V.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: anypad-apk
          path: |
            android/anypad-*.apk
